<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    background: transparent;
    user-select: none;
    -webkit-user-select: none;
    pointer-events: none;
  }
  #fx {
    position: absolute;
    left: 0; top: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }
</style>
</head>
<body>
  <canvas id="fx"></canvas>
  <script src="fx.js"></script>
</body>
</html>
